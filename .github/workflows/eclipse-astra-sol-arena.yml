name: ECLIPSE Astra and Sol actual full-game arena
on:
  pull_request:
    paths:
      - 'Engine/**'
      - '.github/workflows/eclipse-astra-sol-arena.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astra-sol-match-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile real C++ V2 Astra / Sol / R10 game arena
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target eclipse_v9_arena
      - name: Play 24 real complete games, pair each synthetic opening and swap colors
        run: |
          mkdir -p Arena/evidence
          build/Engine/eclipse_v9_arena --ms 70 --openings 4 \
            | tee Arena/evidence/astra-sol-v9-full-games.jsonl
      - name: Independently replay all moves, verify terminal wins and balanced match results
        run: |
          python3 Engine/tests/validate_v9_arena.py \
            Arena/evidence/astra-sol-v9-full-games.jsonl
      - name: Write results to run summary
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=[json.loads(t) for t in Path('Arena/evidence/astra-sol-v9-full-games.jsonl').read_text().splitlines()]
          summaries=[x for x in data if x.get('type')=='summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Actual full-game Gomoku: Astra / Sol / R10 (V9 weights)\n\n')
              f.write('24 games, four synthetic openings, every pair color-swapped; 70ms maximum per move, identical node/depth/root budgets.\n\n')
              f.write('| Contender | Opponent | Wins | Losses | Draws | Games | Score % |\n')
              f.write('|---|---|---:|---:|---:|---:|---:|\n')
              for x in summaries:
                  score=100*(x['wins']+x['draws']/2)/x['games']
                  f.write(f"| {x['model']} | {x['opponent']} | {x['wins']} | {x['losses']} | {x['draws']} | {x['games']} | {score:.1f}% |\n")
              f.write('\n**Exploratory only** — no statistical confidence, original Swift 6x parity, or production checkpoint attestation.\n')
          PY
      - name: Preserve public synthetic game-level JSONL (no player training histories)
        if: always() && hashFiles('Arena/evidence/astra-sol-v9-full-games.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-Astra-Sol-R10-Actual-Paired-Full-Games
          path: Arena/evidence/astra-sol-v9-full-games.jsonl
          retention-days: 30
