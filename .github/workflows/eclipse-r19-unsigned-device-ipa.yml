name: Gomoku V2.0.0 unsigned iPhone IPA candidate
on:
  pull_request:
    paths:
      - 'Apps/iOS/**'
      - 'Engine/**'
      - 'project.yml'
      - 'Scripts/check_private_bundle.py'
      - 'Scripts/check_gomoku_release_identity.py'
      - 'Scripts/check_app_icon.py'
      - '.github/workflows/eclipse-r19-unsigned-device-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-device-candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard against private owner training records
        run: python3 Scripts/check_private_bundle.py
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Gomoku V2.0.0 iOS project
        run: xcodegen generate --spec project.yml
      - name: Build actual Release iphoneos application with C++ V2 production path
        run: |
          xcodebuild -project Gomoku.xcodeproj -scheme Gomoku -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify original owner icon, Gomoku app version and privacy
        run: |
          set -euo pipefail
          test "$(git hash-object Apps/iOS/Gomoku/Assets.xcassets/AppIcon.appiconset/AppIcon.png)" = 760087e995445b8da5ce82a5c272da2f757f2c44
          APP=DerivedData/Build/Products/Release-iphoneos/Gomoku.app
          python3 Scripts/check_app_icon.py "$APP"
          python3 Scripts/check_gomoku_release_identity.py --app "$APP"
          python3 Scripts/check_private_bundle.py --app "$APP"
      - name: Package and hash explicitly UNSIGNED build
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/Gomoku.app \
            artifacts/Payload/Gomoku.app
          (
            cd artifacts
            zip -qr Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.ipa Payload
            shasum -a 256 Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.ipa \
              > Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.sha256
          )
          python3 Scripts/check_private_bundle.py \
            --ipa artifacts/Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.ipa
          python3 Scripts/check_gomoku_release_identity.py \
            --ipa artifacts/Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.ipa
      - name: Export actual unsigned device IPA (not stock iOS installable)
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-V2.0.0-Build200-UNSIGNED-DEVICE
          path: |
            artifacts/Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.ipa
            artifacts/Gomoku-V2.0.0-Build200-ECLIPSE2-UNSIGNED.sha256
          retention-days: 7
