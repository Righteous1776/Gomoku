name: iOS simulator build (prototype; not release)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and SDK
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Simulator build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Show compile artifact
        run: find DerivedData/Build/Products -maxdepth 3 -name 'Gomoku.app' -type d
