name: iOS simulator build (prototype; not release)
on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  pull_request:
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and SDK
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Simulator build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run XCTest on an available iPhone simulator
        run: |
          set -o pipefail
          phone_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in reversed(sorted(d)) if ".iOS-" in runtime for x in d[runtime] if x["name"].startswith("iPhone")))')
          xcodebuild -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug -destination "platform=iOS Simulator,id=$phone_id" -derivedDataPath DerivedData -parallel-testing-enabled NO -resultBundlePath GomokuTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Simulator Release build
        run: xcodebuild -project Gomoku.xcodeproj -scheme Gomoku -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Show compile artifact
        run: find DerivedData/Build/Products -maxdepth 3 -name 'Gomoku.app' -type d
      - name: Upload simulator test results and screenshots
        if: always() && hashFiles('GomokuTests.xcresult/Info.plist') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-simulator-test-results
          path: GomokuTests.xcresult
