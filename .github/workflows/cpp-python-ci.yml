name: C++ and Python CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  pull_request:
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: python3 -m unittest discover -s Training/tests -v
      - name: C++ / Python independent freestyle rules parity
        run: python3 Training/check_cpp_rules_parity.py --engine build/Engine/gomoku_cli
      - name: Verify frozen Swift R10 ordering provenance and exact model coefficients
        run: python3 Engine/tools/verify_swift_ordering.py
      - name: Smoke generate one self-play game
        run: python3 Training/selfplay.py --engine build/Engine/gomoku_cli --games 1 --ms 2 --out Training/outputs/smoke.jsonl
      - name: Validate dataset
        run: python3 Training/validate_dataset.py --path Training/outputs/smoke.jsonl
      - name: Verify exact real owner training evidence
        run: python3 Scripts/verify_owner_training_evidence.py
      - name: Verify package
        run: python3 Scripts/verify_package.py
      - name: Audit all staged VeilLink original sources
        run: |
          python3 Scripts/audit_git_blobs.py
          python3 Scripts/audit_migration.py
      - name: Enforce owner R17.2 UI exclusions
        run: python3 Scripts/verify_gomoku_ui_contract.py
