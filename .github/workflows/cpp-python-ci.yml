name: C++ and Python CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  pull_request:
    paths-ignore:
      - "AGENT_INBOX/**"
      - "AGENTS.md"
      - "Docs/**"
      - "README.md"
      - "Scripts/inbox.py"
      - "Scripts/tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: python3 -m unittest discover -s Training/tests -v
      - name: Smoke generate one self-play game
        run: python3 Training/selfplay.py --engine build/Engine/gomoku_cli --games 1 --ms 2 --out Training/outputs/smoke.jsonl
      - name: Validate dataset
        run: python3 Training/validate_dataset.py --path Training/outputs/smoke.jsonl
      - name: Verify package
        run: python3 Scripts/verify_package.py
