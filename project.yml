name: Gomoku
options:
  bundleIdPrefix: studio.zeo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CLANG_CXX_LANGUAGE_STANDARD: 'c++20'
    CLANG_CXX_LIBRARY: libc++
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Gomoku:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Gomoku
        excludes:
          - Vendor/**
      - path: Apps/iOS/Gomoku/Vendor/GomokuEngineV2
        type: folder
        buildPhase: resources
      - path: Engine/src/board.cpp
      - path: Engine/src/search.cpp
      - path: Engine/src/eclipse_c_api.cpp
      - path: Engine/include/eclipse_c_api.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.zeo.gomoku
        PRODUCT_NAME: Gomoku
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Apps/iOS/Gomoku/Native/Bridge.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Engine/include
          - $(SRCROOT)/Engine/src
        INFOPLIST_KEY_CFBundleDisplayName: Gomoku
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - GomokuTests
        - GomokuUITests
  GomokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOS/GomokuTests
    dependencies:
      - target: Gomoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.zeo.gomoku.tests
  GomokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOS/GomokuUITests
    dependencies:
      - target: Gomoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.zeo.gomoku.uitests
        TEST_TARGET_NAME: Gomoku
